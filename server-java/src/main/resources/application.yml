server:
  port: 8600
  tomcat:
    max-swallow-size: 20MB

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/tiaoxiu?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false&createDatabaseIfNotExist=true
    username: root
    password: "root"
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

jwt:
  secret: "tiaoxiu-default-secret-key-please-change-in-prod-2026-08-28-abcdefghijklmnop"
  expiration-hours: 24

app:
  default-password: "Abc_123456"
  login-lock-threshold: 5
  login-lock-minutes: 15
  cors-allowed-origins: "http://localhost:8601,http://127.0.0.1:8601"
  # 全局写操作冷却：每次增删改落库完成后，至少间隔该毫秒数才允许下一次写操作（防并发冲撞）
  write-cooldown-ms: 3000
