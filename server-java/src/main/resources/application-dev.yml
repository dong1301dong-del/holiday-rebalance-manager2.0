# 本地开发环境：使用 H2（MySQL 兼容模式），无需安装 MySQL 即可运行与测试。
# 生产环境使用 application.yml 中的 MySQL 配置（--spring.profiles.active=prod 或不指定）。
spring:
  datasource:
    url: jdbc:h2:mem:tiaoxiu;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

jwt:
  secret: "tiaoxiu-dev-secret-key-change-me-2026-08-28-abcdefghijklmnop"
  expiration-hours: 24

app:
  default-password: "Abc_123456"
  login-lock-threshold: 5
  login-lock-minutes: 15
  cors-allowed-origins: "http://localhost:8601,http://127.0.0.1:8601"
